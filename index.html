<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>sedentary.</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#050761">

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="sedentary">

    <!-- Icone -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=IBM+Plex+Mono:wght@300;400;500&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Titolo -->
        <h1 class="title">sedentary.</h1>

        <!-- Emoji -->
        <div class="walker">
            🚶
        </div>

        <!-- Timer -->
        <section class="timer">

            <div
                id="leftTimer"
                class="time">

                30

            </div>

            <div class="divider"></div>

            <div
                id="rightTimer"
                class="time">

                10

            </div>

        </section>

        <!-- Pulsante -->
        <button
            id="mainButton"
            class="startButton">

            START!

        </button>

    </main>

    <script src="app.js"></script>

</body>

</html>
